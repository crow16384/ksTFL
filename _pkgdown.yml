# pkgdown site configuration for ksTFL
# https://pkgdown.r-lib.org/reference/build_site.html
#
# Site includes only package-related content. No .md files are kept under .github/
# so pkgdown does not copy any .github assets into docs/ (pkgdown auto-includes
# all .md from root and .github/; keeping .github/ free of .md excludes it).

template:
  bootstrap: 5
  bslib:
    primary: "#2166AC"
    border-radius: "0.375rem"
    font-size-base: "0.95rem"

navbar:
  left:
    - text: Reference
      href: reference/index.html
    - text: Articles
      href: articles/index.html

# Required by pkgdown (placeholder until you deploy; e.g. GitHub Pages)
# When you have a site URL, set it here: url: https://your-org.github.io/ksTFL/
url: https://example.com

# Install package metadata into the package so autolinking works without
# fetching CRAN packages.rds (avoids timeout when building behind firewall/proxy)
deploy:
  install_metadata: true

# Development mode: auto = release vs devel based on version
development:
  mode: auto

articles:
  - title: Foundations
    navbar: Foundations
    contents:
      - Getting_Started_with_ksTFL
      - Reporting_Examples_with_ksTFL
      - Real_Examples_with_ksTFL
  - title: Styling And Layout
    navbar: Styling and Layout
    contents:
      - Styling_Guide_with_ksTFL
      - Column_Width_Management
  - title: Advanced Workflows
    navbar: Advanced
    contents:
      - Advanced_StyleRows
  - title: Internals
    navbar: Internals
    contents:
      - Rendering_Pipeline
      - Font_Management
