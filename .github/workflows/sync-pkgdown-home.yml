name: Sync pkgdown home pages

on:
  push:
    branches: ["master", "main"]
    tags: ["v*", "*.*.*"]
    paths:
      - "DESCRIPTION"
      - "inst/CITATION"
      - "_pkgdown.yml"
      - "README.md"
      - "LICENSE"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-home:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Install pkgdown
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown

      - name: Build pkgdown home pages
        run: Rscript -e 'pkgdown::build_home()'

      - name: Commit updated docs
        if: startsWith(github.ref, 'refs/heads/')
        run: |
          if git diff --quiet -- docs/404.html docs/LICENSE-text.html docs/authors.html docs/authors.md docs/index.html; then
            echo "No home page changes detected."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/404.html docs/LICENSE-text.html docs/authors.html docs/authors.md docs/index.html
          git commit -m "ci: sync pkgdown home pages"
          git push
