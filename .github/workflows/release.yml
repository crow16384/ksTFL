name: Build and Release Binaries

on:
  push:
    tags:
      - 'v*'

jobs:
  # ──────────────────────────────────────────────────────────────────────
  # Source: build source tarball + pkgdown site (once)
  # ──────────────────────────────────────────────────────────────────────
  build-source:
    name: Build source tarball and site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'

      - name: Setup pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            libharfbuzz-dev \
            libfreetype-dev \
            libminizip-dev \
            libfontconfig1-dev \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev \
            pkg-config

      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::pkgdown
            local::.

      - name: Build source package (with vignettes)
        run: R CMD build .

      - name: Build pkgdown site
        run: Rscript -e "pkgdown::build_site(override = list(destination = 'pkgdown-site'))"

      - name: Upload source tarball
        uses: actions/upload-artifact@v4
        with:
          name: source-tarball
          path: ksTFL_*.tar.gz
          if-no-files-found: error

      - name: Upload pkgdown site
        uses: actions/upload-artifact@v4
        with:
          name: pkgdown-site
          path: pkgdown-site/
          if-no-files-found: error

  # ──────────────────────────────────────────────────────────────────────
  # Build: Ubuntu (Debian-based)
  # ──────────────────────────────────────────────────────────────────────
  build-ubuntu:
    name: Build (Ubuntu, R ${{ matrix.r-version }})
    needs: build-source
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        r-version: ['4.4', '4.5']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download source tarball
        uses: actions/download-artifact@v4
        with:
          name: source-tarball

      - name: Setup R ${{ matrix.r-version }}
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r-version }}

      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            libharfbuzz-dev \
            libfreetype-dev \
            libminizip-dev \
            pkg-config

      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2

      - name: Build binary package
        run: |
          PKG_TARBALL=$(ls ksTFL_*.tar.gz)
          R CMD INSTALL --build "$PKG_TARBALL"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pkg-ubuntu-r${{ matrix.r-version }}
          path: ksTFL_*_R_*.tar.gz
          if-no-files-found: error

  # ──────────────────────────────────────────────────────────────────────
  # Build: Red Hat (Fedora container — single R version from distro)
  # ──────────────────────────────────────────────────────────────────────
  build-redhat:
    name: Build (Red Hat / Fedora)
    needs: build-source
    runs-on: ubuntu-latest
    container:
      image: fedora:latest
    env:
      R_LIBS_USER: /tmp/r-lib

    steps:
      - name: Install system tools and R
        run: |
          dnf install -y \
            git \
            which \
            curl \
            gcc \
            gcc-c++ \
            make \
            harfbuzz-devel \
            freetype-devel \
            minizip-ng-compat-devel \
            zlib-devel \
            pkgconf-pkg-config \
            libcurl-devel \
            openssl-devel \
            libxml2-devel \
            fontconfig-devel \
            R-core-devel

      - name: Download source tarball
        uses: actions/download-artifact@v4
        with:
          name: source-tarball

      - name: Detect R version and extract metadata
        run: |
          R_VER=$(Rscript -e 'cat(paste0(R.version$major, ".", sub("\\..*", "", R.version$minor)))')
          echo "R_VER=$R_VER" >> $GITHUB_ENV
          echo "Building with R $R_VER"
          tar xzf ksTFL_*.tar.gz ksTFL/DESCRIPTION --strip-components=1
          echo "DESC_HASH=$(sha256sum DESCRIPTION | cut -d' ' -f1)" >> $GITHUB_ENV

      - name: Create R library directory
        run: mkdir -p $R_LIBS_USER

      - name: Cache R packages
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: fedora-r-${{ env.R_VER }}-${{ env.DESC_HASH }}
          restore-keys: |
            fedora-r-${{ env.R_VER }}-

      - name: Install R dependencies
        run: |
          Rscript -e '
            desc <- read.dcf("DESCRIPTION")
            parse_deps <- function(field) {
              if (is.na(field)) return(character(0))
              deps <- trimws(unlist(strsplit(field, ",")))
              sub("\\s*\\(.*\\)", "", deps)
            }
            imports  <- parse_deps(desc[, "Imports"])
            linking  <- parse_deps(desc[, "LinkingTo"])
            base_pkgs <- rownames(installed.packages(priority = "base"))
            deps <- setdiff(unique(c(imports, linking)), base_pkgs)
            message("Installing: ", paste(deps, collapse = ", "))
            install.packages(deps, repos = "https://cloud.r-project.org",
                             lib = Sys.getenv("R_LIBS_USER"))
          '

      - name: Build binary package
        run: |
          PKG_TARBALL=$(ls ksTFL_*.tar.gz)
          R CMD INSTALL --build "$PKG_TARBALL"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pkg-redhat-r${{ env.R_VER }}
          path: ksTFL_*_R_*.tar.gz
          if-no-files-found: error

  # ──────────────────────────────────────────────────────────────────────
  # Build: Windows
  # ──────────────────────────────────────────────────────────────────────
  build-windows:
    name: Build (Windows, R ${{ matrix.r-version }})
    needs: build-source
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        r-version: ['4.4', '4.5']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download source tarball
        uses: actions/download-artifact@v4
        with:
          name: source-tarball

      - name: Setup R ${{ matrix.r-version }}
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r-version }}

      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2

      - name: Build binary package
        shell: bash
        run: |
          PKG_TARBALL=$(ls ksTFL_*.tar.gz)
          R CMD INSTALL --build "$PKG_TARBALL"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pkg-windows-r${{ matrix.r-version }}
          path: ksTFL_*.zip
          if-no-files-found: error

  # ──────────────────────────────────────────────────────────────────────
  # Build: macOS arm64 + x86_64 (R 4.5 only)
  # ──────────────────────────────────────────────────────────────────────
  build-macos:
    name: Build (macOS ${{ matrix.arch }}, R 4.5)
    needs: build-source
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-latest
          - arch: x86_64
            runner: macos-13

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download source tarball
        uses: actions/download-artifact@v4
        with:
          name: source-tarball

      - name: Setup R 4.5
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5'

      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2

      - name: Build binary package
        run: |
          PKG_TARBALL=$(ls ksTFL_*.tar.gz)
          R CMD INSTALL --build "$PKG_TARBALL"

      - name: Rename binary to include arch
        run: |
          # R CMD INSTALL --build produces ksTFL_<version>.tgz on macOS
          TGZ=$(ls ksTFL_*.tgz)
          BASE="${TGZ%.tgz}"
          mv "$TGZ" "${BASE}_${{ matrix.arch }}.tgz"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pkg-macos-${{ matrix.arch }}-r4.5
          path: ksTFL_*_${{ matrix.arch }}.tgz
          if-no-files-found: error

  # ──────────────────────────────────────────────────────────────────────
  # Deploy + Release: CRAN-like repo, pkgdown site, GitHub Releases
  # ──────────────────────────────────────────────────────────────────────
  deploy-and-release:
    name: Deploy and release
    needs: [build-ubuntu, build-redhat, build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: pkg-*
          path: artifacts/

      - name: Download pkgdown site
        uses: actions/download-artifact@v4
        with:
          name: pkgdown-site
          path: site/

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_KEY }}

      - name: Clone public repo
        run: git clone git@github.com:${{ vars.PUBLIC_REPO }}.git public-repo

      - name: Setup git identity
        working-directory: public-repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'

      - name: Organize Windows binaries
        shell: Rscript {0}
        run: |
          prune_old <- function(dir, pattern, keep = 2) {
            files <- list.files(dir, pattern = pattern, full.names = TRUE)
            if (length(files) <= keep) return()
            bnames <- basename(files)
            vers   <- regmatches(bnames, regexpr("[0-9]+\\.[0-9]+\\.[0-9]+", bnames))
            files  <- files[order(numeric_version(vers), decreasing = TRUE)]
            file.remove(files[-(1:keep)])
          }

          for (r_ver in c("4.4", "4.5")) {
            art_dir <- file.path("artifacts", paste0("pkg-windows-r", r_ver))
            zip_files <- list.files(art_dir, pattern = "\\.zip$", full.names = TRUE)
            if (length(zip_files) == 0) next

            dest_dir <- file.path("public-repo", "bin", "windows", "contrib", r_ver)
            dir.create(dest_dir, recursive = TRUE, showWarnings = FALSE)

            for (f in zip_files) {
              file.copy(f, file.path(dest_dir, basename(f)), overwrite = TRUE)
            }

            prune_old(dest_dir, "\\.zip$", keep = 2)
            tools::write_PACKAGES(dest_dir, type = "win.binary", verbose = TRUE)
            message("Written PACKAGES for win.binary R ", r_ver)
          }

      - name: Organize Linux binaries
        shell: Rscript {0}
        run: |
          prune_old <- function(dir, pattern, keep = 4) {
            files <- list.files(dir, pattern = pattern, full.names = TRUE)
            if (length(files) <= keep) return()
            bnames <- basename(files)
            vers   <- regmatches(bnames, regexpr("[0-9]+\\.[0-9]+\\.[0-9]+", bnames))
            files  <- files[order(numeric_version(vers), decreasing = TRUE)]
            file.remove(files[-(1:keep)])
          }

          distro_map <- list(
            "ubuntu" = "ubuntu-noble",
            "redhat" = "fedora"
          )

          for (distro_key in names(distro_map)) {
            distro_label <- distro_map[[distro_key]]

            art_pattern <- paste0("^pkg-", distro_key, "-r")
            art_dirs <- list.dirs("artifacts", recursive = FALSE, full.names = TRUE)
            art_dirs <- art_dirs[grepl(art_pattern, basename(art_dirs))]

            for (art_dir in art_dirs) {
              tgz_files <- list.files(art_dir, pattern = "\\.tar\\.gz$", full.names = TRUE)
              if (length(tgz_files) == 0) next

              dest_dir <- file.path("public-repo", "bin", "linux", distro_label,
                                    "src", "contrib")
              dir.create(dest_dir, recursive = TRUE, showWarnings = FALSE)

              for (f in tgz_files) {
                dest_name <- sub("_R_[^.]+\\.tar\\.gz$", ".tar.gz", basename(f))
                file.copy(f, file.path(dest_dir, dest_name), overwrite = TRUE)
              }
            }

            dest_dir <- file.path("public-repo", "bin", "linux", distro_label,
                                  "src", "contrib")
            if (dir.exists(dest_dir)) {
              prune_old(dest_dir, "\\.tar\\.gz$", keep = 4)
              tools::write_PACKAGES(dest_dir, type = "source", verbose = TRUE)
              message("Written PACKAGES for ", distro_label)
            }
          }

      - name: Organize macOS binaries
        shell: Rscript {0}
        run: |
          prune_old <- function(dir, pattern, keep = 2) {
            files <- list.files(dir, pattern = pattern, full.names = TRUE)
            if (length(files) <= keep) return()
            bnames <- basename(files)
            vers   <- regmatches(bnames, regexpr("[0-9]+\\.[0-9]+\\.[0-9]+", bnames))
            files  <- files[order(numeric_version(vers), decreasing = TRUE)]
            file.remove(files[-(1:keep)])
          }

          arch_map <- list(
            "arm64"  = "big-sur-arm64",
            "x86_64" = "big-sur-x86_64"
          )

          for (arch in names(arch_map)) {
            platform_dir <- arch_map[[arch]]
            art_dir <- file.path("artifacts", paste0("pkg-macos-", arch, "-r4.5"))
            tgz_files <- list.files(art_dir, pattern = "\\.tgz$", full.names = TRUE)
            if (length(tgz_files) == 0) next

            dest_dir <- file.path("public-repo", "bin", "macosx", platform_dir,
                                  "contrib", "4.5")
            dir.create(dest_dir, recursive = TRUE, showWarnings = FALSE)

            for (f in tgz_files) {
              # Strip _arm64 / _x86_64 suffix before placing in repo dir
              dest_name <- sub(paste0("_", arch, "\\.tgz$"), ".tgz", basename(f))
              file.copy(f, file.path(dest_dir, dest_name), overwrite = TRUE)
            }

            prune_old(dest_dir, "\\.tgz$", keep = 2)
            tools::write_PACKAGES(dest_dir, type = "mac.binary", verbose = TRUE)
            message("Written PACKAGES for macos/", platform_dir, " R 4.5")
          }

      - name: Copy pkgdown site to public repo
        run: |
          # bin/ is untouched — pkgdown writes only HTML/CSS/JS
          cp -r site/. public-repo/

      - name: Ensure .nojekyll exists
        run: touch public-repo/.nojekyll

      - name: Commit and push
        working-directory: public-repo
        run: |
          git add -A
          git diff --cached --quiet && echo "Nothing to commit" && exit 0
          git commit -m "Release ${{ github.ref_name }}"
          git push

      - name: Collect release files
        run: |
          mkdir release-files
          find artifacts/ -type f \( -name "*.zip" -o -name "*_R_*.tar.gz" -o -name "*.tgz" \) \
            -exec cp {} release-files/ \;

      - name: Create GitHub Release (private repo)
        uses: softprops/action-gh-release@v2
        with:
          files: release-files/*
          generate_release_notes: true

      - name: Create GitHub Release (public repo)
        uses: softprops/action-gh-release@v2
        with:
          repository: ${{ vars.PUBLIC_REPO }}
          token: ${{ secrets.PUBLIC_REPO_TOKEN }}
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          files: release-files/*
          generate_release_notes: false
          body: |
            Binary packages for ksTFL ${{ github.ref_name }}.

            **Platforms:** Ubuntu (Noble), Fedora/RHEL, Windows, macOS (arm64, x86_64)
            **R versions:** 4.4, 4.5 (macOS: 4.5 only)

            See [installation instructions](https://crow16384.github.io/ksTFL-release/#installation) for details.
